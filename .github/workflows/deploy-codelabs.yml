name: Deploy Codelabs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'codelabs/**'
      - 'scripts/**'
      - '.github/workflows/deploy-codelabs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install claat
        run: go install github.com/googlecodelabs/tools/claat@latest

      - name: Export codelabs
        run: |
          mkdir -p site
          CLAAT="$HOME/go/bin/claat"

          # codelabs sueltos (codelabs/*.md) y cursos (codelabs/<curso>/*.md)
          find codelabs -name '*.md' | sort | while read -r f; do
            echo "Exporting $f ..."
            "$CLAAT" export -ga "" -o site/ "$f"
          done

      - name: Build index page
        run: python3 scripts/build_index.py codelabs site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
